name: Build Ryeditor

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows build (exe + installer)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild node-pty for Electron (best effort)
        run: npx electron-rebuild -f -w node-pty
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Compile
        run: npm run compile

      - name: Smoke test (launch app, verify it boots)
        run: npx electron . --smoke-test

      - name: Build Windows binaries (NSIS installer + portable exe)
        run: npx electron-builder --win nsis portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ryeditor-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Ryeditor-Windows-x64
          path: release

      - name: Create release with exe assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
